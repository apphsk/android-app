name: Gerar APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Abrir o ZIP
        run: |
          ZIP=$(ls -t *.zip | head -1)
          echo "Usando $ZIP"
          unzip -q -o "$ZIP" -d work
          S=$(find work -name settings.gradle.kts -path '*android*' | head -1)
          echo "ANDROID_DIR=$(dirname "$S")" >> $GITHUB_ENV

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        run: |
          cd "$ANDROID_DIR"
          gradle assembleRelease --no-daemon || gradle assembleRelease --no-daemon -PsemFfmpeg=true

      - name: Publicar em Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: HSK Play APK ${{ github.run_number }}
          files: ${{ env.ANDROID_DIR }}/app/build/outputs/apk/release/*.apk
